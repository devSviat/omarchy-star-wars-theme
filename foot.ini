# Star Wars — foot. Hand-written rather than generated from foot.ini.tpl so
# the background can carry alpha: foot applies it to the cell background
# only, so glyphs stay fully opaque while Hyprland blurs the wallpaper behind
# the window. Colours mirror colors.toml.
#
# blur=yes is required, not decoration: this foot is built with +blur, so it
# speaks ext-background-effect-v1 to Hyprland and, with the default blur=no,
# tells the compositor NOT to blur behind it. The window is then translucent
# but sharp — decoration.blur in hyprland.lua never gets a say.
[colors-dark]
alpha=0.72
blur=yes
foreground=dcd6e6
background=0d0e15
selection-foreground=ffffff
selection-background=26354f

cursor=0d0e15 ffffff

regular0=0d0e15
regular1=e5484d
regular2=3ddc97
regular3=f0c05a
regular4=4d9bff
regular5=9b5cff
regular6=4fd1e8
regular7=dcd6e6

bright0=5e5a74
bright1=ff6b72
bright2=74efb8
bright3=ffd98a
bright4=7fb8ff
bright5=b98cff
bright6=84e4f3
bright7=ffffff
